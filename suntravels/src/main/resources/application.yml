spring:
  application:
    name: sun-travels
  datasource:
    url: ${NEON_DB_URL}
    driverClassName: org.postgresql.Driver
    username: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini


server:
  port: 8080