<!-- Navbar -->
<nav class="st-navbar" [class.scrolled]="isScrolled">
  <div class="st-nav-inner">

    <!-- Brand -->
    <a class="st-brand" routerLink="/search">
      <span class="st-brand-icon">✈</span>
      <span class="st-brand-text">Sun <strong>Travels</strong></span>
    </a>

    <!-- Hamburger (mobile) -->
    <button
      class="st-toggler"
      type="button"
      (click)="isMenuCollapsed = !isMenuCollapsed"
      aria-label="Toggle navigation"
      [class.open]="!isMenuCollapsed"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Nav links -->
    <div class="st-nav-links" [class.show]="!isMenuCollapsed">
      <a class="st-nav-link" routerLink="/search"         routerLinkActive="active" (click)="isMenuCollapsed = true">
        <span class="st-nav-icon">🔍</span> Search Rooms
      </a>
      <a class="st-nav-link" routerLink="/add-contract"   routerLinkActive="active" (click)="isMenuCollapsed = true">
        <span class="st-nav-icon">📄</span> Load Contract
      </a>
      <a class="st-nav-link" routerLink="/view-contracts" routerLinkActive="active" (click)="isMenuCollapsed = true">
        <span class="st-nav-icon">📋</span> View Contracts
      </a>
      <a class="st-nav-link" routerLink="/manage-hotels"  routerLinkActive="active" (click)="isMenuCollapsed = true">
        <span class="st-nav-icon">🏨</span> Manage Hotels
      </a>
    </div>

  </div>
</nav>

<!-- Routed page content -->
<div class="st-page-content">
  <router-outlet></router-outlet>
</div>
