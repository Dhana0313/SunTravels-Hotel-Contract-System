<!-- hotel-management.component.html -->

<div class="page-header">
  <div>
    <p class="page-subtitle">Administration</p>
    <h1 class="page-title">Hotel Management</h1>
  </div>
</div>

<!-- Add Hotel Panel -->
<div class="panel mb-4">
  <div class="panel-header">
    <h2 class="panel-title">Register New Hotel</h2>
    <div class="panel-icon">🏨</div>
  </div>
  <div class="panel-body">

    <div *ngIf="successMessage" class="alert-success-custom">{{ successMessage }}</div>
    <div *ngIf="errorMessage"   class="alert-danger-custom">{{ errorMessage }}</div>

    <form [formGroup]="hotelForm" (ngSubmit)="onSubmit()">
      <div class="d-flex gap-3 align-items-start">
        <div class="flex-grow-1">
          <input
            type="text"
            class="form-control"
            formControlName="hotelName"
            placeholder="Enter hotel name..."
          >
        </div>
        <button type="submit" class="btn-primary-custom" [disabled]="!hotelForm.valid">
          Add Hotel
        </button>
      </div>
    </form>

  </div>
</div>

<!-- Hotels List Panel -->
<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Registered Hotels</h2>
    <span class="count-badge">{{ hotels.length }}</span>
  </div>

  <ul class="hotel-list">
    @for (hotel of hotels; track hotel.id) {
      <li class="hotel-item">
        <span class="hotel-name">
          <span class="hotel-dot"></span>
          {{ hotel.hotelName }}
        </span>
        <span class="hotel-id">ID: {{ hotel.id }}</span>
      </li>
    } @empty {
      <li class="hotel-item">
        <div class="empty-state">
          <div class="empty-icon">🏨</div>
          <p>No hotels registered yet.</p>
        </div>
      </li>
    }
  </ul>
</div>
