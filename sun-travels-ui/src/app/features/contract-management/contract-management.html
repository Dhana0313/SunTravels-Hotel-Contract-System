<!-- contract-management.component.html -->

<div class="page-header">
  <div>
    <p class="page-subtitle">Administration</p>
    <h1 class="page-title">Add New Contract</h1>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Contract Details</h2>
    <div class="panel-icon">📄</div>
  </div>
  <div class="panel-body">

    <div *ngIf="successMessage" class="alert-success-custom">{{ successMessage }}</div>
    <div *ngIf="errorMessage"   class="alert-danger-custom">{{ errorMessage }}</div>

    <form [formGroup]="contractForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <label class="form-label-custom">Select Hotel</label>
        <select class="form-select" formControlName="hotelId">
          <option value="" disabled>Choose a hotel...</option>
          <option *ngFor="let hotel of hotels" [value]="hotel.id">{{ hotel.hotelName }}</option>
        </select>
      </div>

      <div class="row g-3 form-row">
        <div class="col-6">
          <label class="form-label-custom">Valid From</label>
          <input type="date" class="form-control" formControlName="validFrom">
        </div>
        <div class="col-6">
          <label class="form-label-custom">Valid To</label>
          <input type="date" class="form-control" formControlName="validTo">
        </div>
      </div>

      <div class="form-row">
        <label class="form-label-custom">Markup Percentage (%)</label>
        <input type="number" class="form-control" formControlName="markupPercentage" placeholder="e.g. 15">
      </div>

      <!-- Room Types Section -->
      <div class="section-divider">
        <span class="section-label">Room Types</span>
        <button type="button" class="btn-outline-custom" (click)="addRoomType()">+ Add Room Type</button>
      </div>

      <div formArrayName="roomTypes">
        @for (room of roomTypes.controls; track $index; let i = $index) {
          <div [formGroupName]="i" class="room-card">
            <div class="room-card-header">
              <span class="room-number">Room #{{ i + 1 }}</span>
              @if (roomTypes.length > 1) {
                <button type="button" class="btn-remove" (click)="removeRoomType(i)">Remove</button>
              }
            </div>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label-custom">Type Name</label>
                <input type="text" class="form-control" formControlName="typeName" placeholder="e.g. Standard, Deluxe">
              </div>
              <div class="col-6">
                <label class="form-label-custom">Base Price ($)</label>
                <input type="number" class="form-control" formControlName="price">
              </div>
              <div class="col-6">
                <label class="form-label-custom">No. of Rooms</label>
                <input type="number" class="form-control" formControlName="noOfRooms">
              </div>
              <div class="col-12">
                <label class="form-label-custom">Max Adults per Room</label>
                <input type="number" class="form-control" formControlName="maxAdults">
              </div>
            </div>
          </div>
        }
      </div>

      <div class="mt-4">
        <button type="submit" class="btn-primary-custom w-100" [disabled]="!contractForm.valid">
          Save Contract
        </button>
      </div>

    </form>
  </div>
</div>
